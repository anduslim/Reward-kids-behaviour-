name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only need to push the built site to the gh-pages branch.
permissions:
  contents: write

# Don't run overlapping deploys.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Assemble site (intro at root, app at /app/)
        run: |
          rm -rf _site
          mkdir -p _site/app
          cp -r landing/. _site/
          cp -r dist/. _site/app/
          # SPA fallback for deep links into the app
          cp dist/index.html _site/app/404.html
          # Serve files verbatim (don't let Jekyll strip assets/underscored files)
          touch _site/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy ${{ github.sha }}"
